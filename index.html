<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-file-pdf"></i> Image to PDF Converter</h1>
            <p>Convert your images into a single PDF document effortlessly.</p>
        </header>

        <!-- Upload Drop Zone -->
        <div class="upload-area" id="drop-zone">
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <h3>Drag & Drop Images Here</h3>
            <p>or</p>
            <label for="file-input" class="btn btn-select">Select Images</label>
            <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" multiple hidden>
        </div>

        <!-- Controls Section -->
        <div class="controls-section" id="controls" style="display: none;">
            <div class="control-group">
                <label for="page-orientation">Orientation:</label>
                <select id="page-orientation">
                    <option value="portrait">Portrait</option>
                    <option value="landscape">Landscape</option>
                </select>
            </div>
            <div class="control-group">
                <label for="page-margin">Margin (mm):</label>
                <input type="number" id="page-margin" min="0" max="50" value="10">
            </div>
            <button class="btn btn-clear" id="clear-all-btn"><i class="fa-solid fa-trash"></i> Clear All</button>
        </div>

        <!-- Image Preview Grid -->
        <div class="preview-grid" id="preview-grid"></div>

        <!-- Action Section -->
        <div class="action-section" id="action-section" style="display: none;">
            <button class="btn btn-convert" id="convert-btn">
                <i class="fa-solid fa-download"></i> Convert & Download PDF
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
