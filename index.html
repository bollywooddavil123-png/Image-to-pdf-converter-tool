<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to PDF Converter</title>
  <link rel="stylesheet" href="style.css">
  <!-- jsPDF Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Image to PDF Converter</h1>
      <p>Convert your JPEG, PNG, or WebP images into a single PDF document instantly.</p>
    </header>

    <main>
      <!-- Upload Zone -->
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-content">
          <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <p class="drop-text">Drag & Drop images here or <span class="browse-btn">Browse</span></p>
          <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" multiple hidden>
        </div>
      </div>

      <!-- Controls & Customization -->
      <div class="controls-panel" id="controls-panel" style="display: none;">
        <div class="control-group">
          <label for="page-orientation">Orientation:</label>
          <select id="page-orientation">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>

        <div class="control-group">
          <label for="margin-select">Page Margin:</label>
          <select id="margin-select">
            <option value="none">No Margin</option>
            <option value="small" selected>Small Margin</option>
            <option value="big">Big Margin</option>
          </select>
        </div>

        <div class="control-group button-group">
          <button id="clear-all-btn" class="btn btn-secondary">Clear All</button>
          <button id="convert-btn" class="btn btn-primary">Convert to PDF</button>
        </div>
      </div>

      <!-- Preview Section -->
      <div class="preview-container" id="preview-container"></div>
    </main>

    <footer>
      <p>100% Free & Secure — All image processing is done locally in your browser.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
